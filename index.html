<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lake Washington Water Level</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container mt-4">
        <header class="mb-4">
            <h1>Lake Washington Water Level</h1>
            <div id="latestDataInfo" class="text-muted mb-3">
                Latest: <span id="latestTime">--</span> | <span id="latestLevel" class="fw-bold">--</span>
            </div>
        </header>

        <div class="card mb-4">
            <div class="card-body">
                <div id="chart" class="chart-container"></div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Time Range</div>
                    <div class="card-body">
                        <select id="timeRange" class="form-select mb-2">
                            <option value="1">Last 24 Hours</option>
                            <option value="7">Last 7 Days</option>
                            <option value="14">Last 2 Weeks</option>
                            <option value="30">Last Month</option>
                            <option value="90" selected>Last 3 Months</option>
                            <option value="365">Last Year</option>
                            <option value="all">All Data</option>
                        </select>
                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label for="startDate" class="form-label">Start Date</label>
                                <input type="date" id="startDate" class="form-control">
                            </div>
                            <div class="col-md-6 mb-2">
                                <label for="endDate" class="form-label">End Date</label>
                                <input type="date" id="endDate" class="form-control">
                            </div>
                        </div>
                        <button id="applyCustomRange" class="btn btn-primary">Apply Custom Range</button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Statistics</div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-md-4">
                                <div class="stat-label">Minimum</div>
                                <div id="minValue" class="stat-value">--</div>
                            </div>
                            <div class="col-md-4">
                                <div class="stat-label">Maximum</div>
                                <div id="maxValue" class="stat-value">--</div>
                            </div>
                            <div class="col-md-4">
                                <div class="stat-label">Average</div>
                                <div id="avgValue" class="stat-value">--</div>
                            </div>
                        </div>
                        <div class="form-check mt-3">
                            <input class="form-check-input" type="checkbox" id="showAverage">
                            <label class="form-check-label" for="showAverage">
                                Show Average Line
                            </label>
                        </div>
                        <hr class="mt-3">
                        <div class="data-display-options">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="enableSmoothing" checked>
                                <label class="form-check-label" for="enableSmoothing">
                                    Smooth Data
                                </label>
                            </div>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" id="showAllPoints">
                                <label class="form-check-label" for="showAllPoints">
                                    Show All Data Points
                                </label>
                            </div>
                        </div>
                        <div class="data-quality mt-3 text-center">
                            <small class="text-muted">Data Quality: <span id="dataQuality">100%</span> (<span id="validPoints">0</span>/<span id="totalPoints">0</span> points)</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dataLoader.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
